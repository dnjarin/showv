[package]
name = "tekaddon"
version = "0.1.0"
description = "Tekkadon: inventario y facturación interna"
authors = ["Tekkadon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tekaddon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "backup"] }
rusqlite_migration = "1"
argon2 = { version = "0.5", features = ["std", "rand"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.13"
sha2 = "0.10"
time = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Almacén de llaves del sistema (Windows: Administrador de credenciales / DPAPI; macOS: Llavero)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
